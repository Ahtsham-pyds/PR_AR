

version: "3.8"

# ---------------------------------------------------------------------------
# SOW Agentic Memory System — local infra
# Brings up: Zookeeper, Kafka, Kafka UI, Redis, Neo4j, Postgres
# Everything else (Python app, LangGraph agent, FastAPI) runs OUTSIDE docker
# for now, so it's easy to debug step-by-step.
# ---------------------------------------------------------------------------

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: sow-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: sow-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Dev-only convenience. We will DISABLE this in Phase 2 once we
      # create topics explicitly with proper partition counts + configs.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: sow-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: sow-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  redis:
    image: redis:7.2-alpine
    container_name: sow-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

  neo4j:
    image: neo4j:5.20-community
    container_name: sow-neo4j
    ports:
      - "7474:7474"   # browser UI -> http://localhost:7474
      - "7687:7687"   # bolt protocol (driver connections)
    environment:
      NEO4J_AUTH: neo4j/sow_password_change_me
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_pagecache_size: 512M
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data

  postgres:
    image: postgres:16-alpine
    container_name: sow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: sow_agent
      POSTGRES_USER: sow_admin
      POSTGRES_PASSWORD: sow_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  neo4j_data:
  postgres_data:
